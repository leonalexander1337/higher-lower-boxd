<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Higher Lower Movies</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="app">

        <div id="sidebar-left" class="sidebar">
            <h2>Modes</h2>
            <button onclick="setMode('movies', this)">All</button>
            <button onclick="setMode('action', this)">Action</button>
            <button onclick="setMode('animation', this)">Animation</button>
            <button onclick="setMode('horror', this)">Horror</button>
        </div>

        <div id="main">
            <div class="mobile-header">
                <span class="hamburger">☰</span>
                <h2>Modes</h2>
                <p>Data: <a href="https://datasets.imdbws.com/" target="_blank" rel="noopener noreferrer">IMDB</a></br>Posters: <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a></p>
            </div>
            
            <div id="score">Score: 0</div>
            <div id="highscore">Highscore: 0</div>

            <div id="game">
                <div id="movieA"></div>
                <div id="buttons">
                    <button onclick="guess('higher')">Higher</button>
                    <button onclick="guess('lower')">Lower</button>
                </div>
                <div id="movieB"></div>
            </div>
        </div>

        <div id="sidebar-right" class="sidebar">
            <h2>About</h2>
            <p>Guess which movie has a higher IMDB rating. Start playing with all movies or select a genre mode!</p>
            <p>Data from <a href="https://datasets.imdbws.com/" target="_blank" rel="noopener noreferrer">IMDB</a>.</p>
            <p>Posters through <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a> API.</p>
            <img src="data/tmdb_logo.svg" alt="TMDB Logo" class="tmdb-logo">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>

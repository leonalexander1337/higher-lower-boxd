<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Higher Lower Movies</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="app">

        <div id="sidebar-left" class="sidebar">
            <h2>Modes</h2>
            <div class="mode-buttons">
                <button data-mode="movies">All</button>
                <button data-mode="action">Action</button>
                <button data-mode="animation">Animation</button>
                <button data-mode="comedy">Comedy</button>
                <button data-mode="crime">Crime</button>
                <button data-mode="drama">Drama</button>
                <button data-mode="horror">Horror</button>
                <button data-mode="romance">Romance</button>
                <button data-mode="scifi">Sci-Fi</button>
                <button data-mode="thriller">Thriller</button>
                <button data-mode="western">Western</button>
            </div>
            <div class="slider-section">
                <h3>Year Range</h3>
                <div id="year-slider-container">
                    <div id="slider-track">
                        <div id="slider-range"></div>
                        <div id="thumb-min" class="thumb"></div>
                        <div id="thumb-max" class="thumb"></div>
                    </div>
                    <div class="slider-labels">
                        <span id="slider-label-min">1920s</span>
                        <span id="slider-label-max">2020s</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="main">
            <div class="mobile-header">
                <span class="hamburger">☰</span>
                <h2>Modes</h2>
                <p>Data: <a href="https://datasets.imdbws.com/" target="_blank" rel="noopener noreferrer">IMDB</a></br>Posters: <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a></p>
            </div>
            
            <div id="score">Score: 0</div>
            <div id="highscore">Highscore: 0</div>

            <div id="game">
                <div id="movieA"></div>
                <div id="buttons">
                    <button id="btn-higher">Higher</button>
                    <button id="btn-lower">Lower</button>
                </div>
                <div id="movieB"></div>
            </div>
        </div>

        <div id="sidebar-right" class="sidebar">
            <h2>About</h2>
            <p>Guess which movie has a higher IMDB rating. Start playing with all movies or select a genre mode!</p>
            <p>Data from <a href="https://datasets.imdbws.com/" target="_blank" rel="noopener noreferrer">IMDB</a>.</p>
            <p>Posters through <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a> API.</p>
            <img src="data/tmdb_logo.svg" alt="TMDB Logo" class="tmdb-logo">
        </div>

    </div>

    <div id="updated"></div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
